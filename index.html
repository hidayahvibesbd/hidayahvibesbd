<!DOCTYPE html>
<html lang="bn">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidayah Vibes BD - ইসলামিক জ্ঞান ও নির্দেশনা</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="logo-container">
                <img src="logo.png" alt="Hidayah Vibes BD Logo" class="logo">
                <h1 class="site-title">Hidayah Vibes BD</h1>
            </div>
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="খুঁজুন (কুরআন, হাদিস, লেখা...)">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <nav>
        <div class="container nav-container">
            <ul class="nav-menu">
                <li><a href="#home" class="active"><i class="fas fa-home"></i> হোম</a></li>
                <li><a href="#quran"><i class="fas fa-book-quran"></i> কোরআন</a></li>
                <li><a href="#hadith"><i class="fas fa-book-open"></i> হাদিস</a></li>
                <li><a href="#articles"><i class="fas fa-pen-nib"></i> ইসলামিক লেখা</a></li>
                <li><a href="#videos"><i class="fas fa-video"></i> ভিডিও</a></li>
                <li><a href="/admin"><i class="fas fa-user-shield"></i> অ্যাডমিন</a></li>
            </ul>
            <div class="mobile-menu-toggle"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <main>
        <section id="home" class="section active">
            <div class="container">
                <div class="section-header"><h2><i class="fas fa-star-and-crescent"></i> সাম্প্রতিক পোস্টসমূহ</h2></div>
                <div id="latest-posts-container" class="posts-grid">
                    </div>
            </div>
        </section>

        <section id="quran" class="section">
            <div class="container">
                <div class="section-header"><h2><i class="fas fa-book-quran"></i> পবিত্র কুরআন</h2></div>
                <div id="quranList" class="articles-list"></div>
            </div>
        </section>

        <section id="hadith" class="section">
            <div class="container">
                <div class="section-header"><h2><i class="fas fa-book-open"></i> হাদিস শরীফ</h2></div>
                <div id="hadithList" class="hadith-list"></div>
            </div>
        </section>

        <section id="articles" class="section">
            <div class="container">
                <div class="section-header"><h2><i class="fas fa-pen-nib"></i> ইসলামিক লেখা</h2></div>
                <div id="articlesList" class="articles-list"></div>
            </div>
        </section>

        <section id="videos" class="section">
            <div class="container">
                <div class="section-header"><h2><i class="fas fa-video"></i> ইসলামিক ভিডিও</h2></div>
                <div id="videosList" class="videos-list"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="copyright">
            <p>২০২৬ © Hidayah Vibes BD কর্তৃক সর্বস্বত্ব সংরক্ষিত</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
    </html>
